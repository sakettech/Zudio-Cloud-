<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accessories - Zudio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0f1014; --card-bg: #1c1d22; --accent: #ff416c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: white; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 20px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .banner { width: 100%; height: 160px; object-fit: cover; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; overflow-y: auto; padding-bottom: 30px; }
        .product-card { background: var(--card-bg); border-radius: 12px; border: 1px solid #333; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .info { padding: 12px; }
        .info h3 { font-size: 13px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .info p { font-size: 15px; font-weight: bold; }
        .add-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(255,65,108,0.1); color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>
<div id="app-container">
    <div class="header">
        <div style="display:flex; align-items:center; gap:15px;">
            <i class="fa-solid fa-arrow-left" onclick="window.history.back()" style="cursor:pointer;"></i> Accessories
        </div>
        <i class="fa-solid fa-bag-shopping" onclick="window.location.href='bag.html'" style="cursor:pointer;"></i>
    </div>
    
    <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800" class="banner">
    
    <div class="product-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400">
            <div class="info"><h3>Aviator Sunglasses</h3><p>₹299</p></div>
            <div class="add-btn" onclick="addToCart('Aviator Sunglasses', 299, 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400')"><i class="fa-solid fa-plus"></i></div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=400">
            <div class="info"><h3>Premium Leather Belt</h3><p>₹399</p></div>
            <div class="add-btn" onclick="addToCart('Premium Leather Belt', 399, 'https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=400')"><i class="fa-solid fa-plus"></i></div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523206489230-c012c64b2b48?w=400">
            <div class="info"><h3>Minimalist Watch</h3><p>₹899</p></div>
            <div class="add-btn" onclick="addToCart('Minimalist Watch', 899, 'https://images.unsplash.com/photo-1523206489230-c012c64b2b48?w=400')"><i class="fa-solid fa-plus"></i></div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400">
            <div class="info"><h3>Travel Backpack</h3><p>₹999</p></div>
            <div class="add-btn" onclick="addToCart('Travel Backpack', 999, 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400')"><i class="fa-solid fa-plus"></i></div>
        </div>
    </div>
</div>
<script>
    function addToCart(title, price, img) {
        let cart = JSON.parse(localStorage.getItem('zudio_cart')) || [];
        cart.push({ id: Date.now(), title: title, price: price, mrp: price + 500, img: img });
        localStorage.setItem('zudio_cart', JSON.stringify(cart)); alert('Added to Bag!');
    }
</script>
</body>
</html>
