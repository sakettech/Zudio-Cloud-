<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zudio Avatar Studio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           GLOBAL & ZUDIO UI STYLES
        ========================================= */
        :root {
            --bg-dark: #0f1014;
            --card-bg: #1c1d22;
            --accent: #ff416c;
            --text: #ffffff;
            --text-muted: #8e8e93;
            --border: #222;

            /* AVATAR DYNAMIC VARIABLES */
            --skin-color: #c98b62;
            --hair-color: #17120f;
            --top-color: #7657c9;
            --pant-color: #24252b;
            --shoe-color: #ffffff;
            --glass-color: #111111;
            --hat-color: #ff416c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        body { background: var(--bg-dark); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: var(--bg-dark); position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        /* HEADER */
        .header { padding: 15px 20px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; background: var(--bg-dark); }
        .header i { cursor: pointer; font-size: 18px; }
        .header-title { display: flex; align-items: center; gap: 10px; }
        .header-title span { color: var(--accent); }

        /* PREVIEW AREA */
        .preview-area { height: 280px; width: 100%; background: radial-gradient(circle at 50% 50%, #2a2b36 0%, var(--bg-dark) 80%); display: flex; justify-content: center; align-items: flex-start; overflow: hidden; position: relative; }
        
        .download-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(5px); z-index: 20; }
        
        /* AVATAR STAGE (Scaled for Mobile) */
        .avatar-stage { transform: scale(0.55); transform-origin: top center; margin-top: 10px; }
        .avatar { width: 320px; height: 500px; position: relative; }

        /* =========================================
           AVATAR CSS ART (Same High Quality)
        ========================================= */
        .skin { background-color: var(--skin-color); transition: background 0.3s; }
        .leg { position: absolute; width: 65px; height: 160px; background: var(--pant-color); bottom: 10px; z-index: 1; transition: 0.3s; }
        .leg.left { left: 95px; border-radius: 10px 0 10px 10px; }
        .leg.right { right: 95px; border-radius: 0 10px 10px 10px; }
        .leg::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 15px; background: rgba(0,0,0,0.2); }

        .shoe { position: absolute; width: 85px; height: 45px; background: var(--shoe-color); bottom: -10px; border-radius: 30px 40px 15px 15px; z-index: 2; transition: 0.3s; box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15); }
        .shoe.left { left: 75px; }
        .shoe.right { right: 75px; transform: scaleX(-1); }
        .shoe::before { content: ''; position: absolute; top: 10px; left: 20px; width: 25px; height: 3px; background: rgba(0,0,0,0.1); box-shadow: 0 6px 0 rgba(0,0,0,0.1), 0 12px 0 rgba(0,0,0,0.1); }

        .arm { position: absolute; width: 50px; height: 180px; background: var(--top-color); top: 190px; border-radius: 30px; z-index: 1; transition: 0.3s; }
        .arm.left { left: 45px; transform: rotate(12deg); }
        .arm.right { right: 45px; transform: rotate(-12deg); }
        .hand { position: absolute; width: 40px; height: 40px; bottom: -15px; left: 5px; border-radius: 50%; z-index: 0; }

        .torso { position: absolute; width: 180px; height: 210px; background: var(--top-color); left: 70px; top: 180px; border-radius: 50px 50px 20px 20px; z-index: 3; transition: 0.3s; overflow: hidden; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1); }
        .chest-logo { position: absolute; width: 60px; height: 60px; top: 50px; left: 60px; opacity: 0.8; display: none; }
        .buttons { position: absolute; width: 4px; height: 100%; background: rgba(0,0,0,0.1); left: 88px; display: none; }
        .buttons::after { content: '• • • •'; color: rgba(255,255,255,0.5); font-size: 20px; position: absolute; top: 20px; left: -5px; word-break: break-all; width: 10px; line-height: 25px; }

        .hoodie-pocket { position: absolute; width: 120px; height: 60px; background: rgba(0,0,0,0.08); bottom: 20px; left: 30px; border-radius: 20px 20px 10px 10px; display: none; }
        .hoodie-strings { position: absolute; width: 40px; height: 60px; top: 0; left: 70px; display: none; }
        .hoodie-strings::before, .hoodie-strings::after { content:''; position:absolute; width:4px; height:50px; background:#fff; border-radius:4px; top:10px; }
        .hoodie-strings::before { left: 0; transform: rotate(10deg); }
        .hoodie-strings::after { right: 0; transform: rotate(-10deg); }

        .neck { position: absolute; width: 50px; height: 40px; left: 135px; top: 160px; z-index: 2; box-shadow: inset 0 15px 15px rgba(0,0,0,0.2); }
        .collar { position: absolute; width: 90px; height: 30px; background: var(--top-color); left: 115px; top: 175px; border-radius: 50px; z-index: 4; transition: 0.3s; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .head { position: absolute; width: 160px; height: 180px; left: 80px; top: 10px; border-radius: 45% 45% 40% 40%; z-index: 5; box-shadow: inset -8px -15px 0 rgba(0,0,0,0.05); }

        .ear { position: absolute; width: 25px; height: 40px; top: 75px; border-radius: 50%; z-index: 4; }
        .ear.left { left: -10px; }
        .ear.right { right: -10px; }
        .eye { position: absolute; width: 14px; height: 18px; background: #111; border-radius: 50%; top: 85px; z-index: 6; }
        .eye::after { content: ''; position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; top: 3px; right: 3px; }
        .eye.left { left: 45px; }
        .eye.right { right: 45px; }
        .eyebrow { position: absolute; width: 22px; height: 6px; background: #333; border-radius: 10px; top: 70px; z-index: 6; }
        .eyebrow.left { left: 40px; transform: rotate(-5deg); }
        .eyebrow.right { right: 40px; transform: rotate(5deg); }
        .blush { position: absolute; width: 20px; height: 10px; background: rgba(255,100,100,0.3); border-radius: 50%; top: 110px; z-index: 6; }
        .blush.left { left: 30px; }
        .blush.right { right: 30px; }
        .mouth { position: absolute; width: 30px; height: 15px; border-bottom: 4px solid #522e27; border-radius: 50%; left: 65px; top: 120px; z-index: 6; transition: 0.2s; }

        .hair-back { position: absolute; width: 180px; height: 200px; background: var(--hair-color); left: 70px; top: 20px; border-radius: 50%; z-index: 1; display: none; transition: 0.3s; }
        .hair-front { position: absolute; background: var(--hair-color); z-index: 7; transition: 0.3s; }
        .hair-style-1 .hair-front { width: 170px; height: 80px; left: -5px; top: -10px; border-radius: 80px 80px 30px 30px; }
        .hair-style-2 .hair-front { width: 160px; height: 70px; left: 0px; top: -20px; clip-path: polygon(0% 100%, 10% 0%, 25% 100%, 40% 0%, 55% 100%, 75% 0%, 85% 100%, 100% 0%, 100% 100%); }
        .hair-style-3 .hair-front { width: 170px; height: 70px; left: -5px; top: -10px; border-radius: 80px 80px 0 0; }
        .hair-style-3 .hair-back { display: block; } 

        .glasses { position: absolute; left: 25px; top: 75px; width: 110px; height: 35px; z-index: 8; display: none; }
        .glasses::before { content:''; position:absolute; width:20px; height:4px; background:var(--glass-color); left:45px; top:15px; }
        .glass-lens { position: absolute; width: 45px; height: 40px; border: 4px solid var(--glass-color); border-radius: 12px; background: rgba(255,255,255,0.2); }
        .glass-lens.left { left: 0; }
        .glass-lens.right { right: 0; }
        .sunglasses .glass-lens { background: var(--glass-color); border-radius: 10px; border: none; height: 35px; }

        .hat { position: absolute; left: -10px; top: -15px; width: 180px; height: 60px; background: var(--hat-color); border-radius: 100px 100px 20px 20px; z-index: 10; display: none; }
        .hat::after { content: ""; position: absolute; width: 120px; height: 15px; background: var(--hat-color); bottom: -5px; right: -20px; border-radius: 20px; filter: brightness(0.8); }

        /* =========================================
           MOBILE CONTROLS (TABS & GRID)
        ========================================= */
        .categories-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--card-bg); scroll-behavior: smooth; }
        .cat-btn { padding: 8px 16px; background: var(--bg-dark); border: 1px solid #333; border-radius: 20px; color: var(--text-muted); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

        .items-container { flex: 1; overflow-y: auto; padding: 15px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; background: var(--bg-dark); padding-bottom: 20px; }
        
        .item-card { background: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 15px 5px; cursor: pointer; text-align: center; transition: 0.2s; }
        .item-card.selected { border-color: var(--accent); background: rgba(255,65,108,0.1); }
        .color-blob { width: 35px; height: 35px; border-radius: 50%; margin: 0 auto 8px; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .item-name { font-size: 10px; color: var(--text-muted); font-weight: 500; }

        /* ACTION BAR */
        .action-bar { padding: 15px 20px; display: flex; gap: 10px; background: var(--card-bg); border-top: 1px solid var(--border); }
        .action-btn { flex: 1; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; transition: 0.2s; }
        .action-btn:active { transform: scale(0.97); }
        .btn-random { background: #333; color: white; }
        .btn-save { background: var(--accent); color: white; }

        /* TOAST */
        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #34c759; color: white; padding: 12px 25px; border-radius: 30px; font-size: 12px; font-weight: 600; display: none; z-index: 999; box-shadow: 0 5px 15px rgba(52,199,89,0.3); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="toast" class="toast"><i class="fa-solid fa-check"></i> Avatar Saved!</div>

    <!-- HEADER -->
    <div class="header">
        <div class="header-title">
            <i class="fa-solid fa-arrow-left" onclick="window.history.back()"></i> 
            Virtual <span>Studio</span>
        </div>
        <i class="fa-regular fa-circle-question" style="color: gray;"></i>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-area" id="previewArea">
        <button class="download-btn" onclick="downloadAvatar()"><i class="fa-solid fa-download"></i></button>

        <div class="avatar-stage" id="avatarStage">
            <div class="avatar hair-style-1" id="avatarContainer">
                <div class="hair-back"></div>
                <div class="arm left"><div class="hand skin"></div></div>
                <div class="arm right"><div class="hand skin"></div></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="shoe left"></div>
                <div class="shoe right"></div>

                <div class="torso" id="torso">
                    <div class="chest-logo" id="chestLogo"><i class="fa-solid fa-bolt" style="font-size: 40px; color: rgba(255,255,255,0.5);"></i></div>
                    <div class="buttons" id="shirtButtons"></div>
                    <div class="hoodie-pocket" id="hoodiePocket"></div>
                </div>
                
                <div class="hoodie-strings" id="hoodieStrings"></div>
                <div class="neck skin"></div>
                <div class="collar" id="collar"></div>

                <div class="head skin" id="head">
                    <div class="ear left skin"></div><div class="ear right skin"></div>
                    <div class="blush left"></div><div class="blush right"></div>
                    <div class="eyebrow left"></div><div class="eyebrow right"></div>
                    <div class="eye left"></div><div class="eye right"></div>
                    <div class="mouth" id="mouth"></div>

                    <div class="glasses" id="glasses">
                        <div class="glass-lens left"></div><div class="glass-lens right"></div>
                    </div>

                    <div class="hair-front"></div>
                    <div class="hat" id="hat"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HORIZONTAL CATEGORIES -->
    <div class="categories-scroll">
        <button class="cat-btn active" data-category="face"><i class="fa-solid fa-face-smile"></i> Face</button>
        <button class="cat-btn" data-category="hair"><i class="fa-solid fa-scissors"></i> Hair</button>
        <button class="cat-btn" data-category="tops"><i class="fa-solid fa-shirt"></i> Tops</button>
        <button class="cat-btn" data-category="hoodies"><i class="fa-solid fa-vest"></i> Hoodies</button>
        <button class="cat-btn" data-category="pants"><i class="fa-solid fa-socks"></i> Pants</button>
        <button class="cat-btn" data-category="shoes"><i class="fa-solid fa-shoe-prints"></i> Shoes</button>
        <button class="cat-btn" data-category="glasses"><i class="fa-solid fa-glasses"></i> Glasses</button>
        <button class="cat-btn" data-category="hats"><i class="fa-solid fa-hat-cowboy"></i> Hats</button>
    </div>

    <!-- ITEMS GRID -->
    <div class="items-container" id="itemsGrid"></div>

    <!-- BOTTOM ACTIONS -->
    <div class="action-bar">
        <button class="action-btn btn-random" onclick="randomizeAvatar()"><i class="fa-solid fa-dice"></i> Random</button>
        <button class="action-btn btn-save" onclick="saveAvatar()"><i class="fa-solid fa-floppy-disk"></i> Save Avatar</button>
    </div>
</div>

<script>
/* =========================================
   DATABASE & CONFIGURATION
========================================= */
const root = document.documentElement;
const avatarEl = document.getElementById('avatarContainer');

const colors = [
    "#111827", "#374151", "#7c3aed", "#8b5cf6", "#ec4899", 
    "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", 
    "#2563eb", "#ffffff", "#1e3a8a", "#0f766e", "#854d0e"
];

const skinTones = ["#f4c7a1", "#edb08b", "#d99b73", "#c98b62", "#b8734c", "#9b603d", "#7b4a2d", "#4a2c1a"];
const hairColors = ["#111111", "#3b2313", "#5c3317", "#8b4513", "#a0522d", "#cd853f", "#f4a460", "#e6e6fa", "#ff69b4", "#4682b4"];

const db = {
    face: [
        ...skinTones.map((c, i) => ({ name: `Skin ${i+1}`, type: 'skin', value: c })),
        { name: "Smile", type: 'expr', value: 'smile' },
        { name: "Neutral", type: 'expr', value: 'neutral' },
        { name: "Surprised", type: 'expr', value: 'surprised' }
    ],
    hair: [], tops: [], hoodies: [], pants: [], shoes: [],
    glasses: [
        { name: "Clear Round", type: 'clear', color: '#111' },
        { name: "White Frame", type: 'clear', color: '#fff' },
        { name: "Red Frame", type: 'clear', color: '#ef4444' },
        { name: "Dark Shades", type: 'dark', color: '#111' },
        { name: "Blue Shades", type: 'dark', color: '#2563eb' },
        { name: "None", type: 'none', color: 'transparent' }
    ],
    hats: [
        { name: "Black Cap", color: '#111' },
        { name: "Red Cap", color: '#ef4444' },
        { name: "Blue Cap", color: '#2563eb' },
        { name: "White Cap", color: '#fff' },
        { name: "None", color: 'transparent' }
    ]
};

// Generate Combinations
hairColors.forEach((c, i) => {
    db.hair.push({ name: `Short ${i+1}`, style: 1, color: c });
    db.hair.push({ name: `Spiky ${i+1}`, style: 2, color: c });
    db.hair.push({ name: `Long ${i+1}`, style: 3, color: c });
});

colors.forEach((c, i) => {
    db.tops.push({ name: `T-Shirt ${i+1}`, style: 'tshirt', color: c });
    db.tops.push({ name: `Shirt ${i+1}`, style: 'shirt', color: c });
    db.hoodies.push({ name: `Hoodie ${i+1}`, style: 'hoodie', color: c });
    db.pants.push({ name: `Pant ${i+1}`, color: c });
    db.shoes.push({ name: `Sneaker ${i+1}`, color: c });
});

/* =========================================
   UI & LOGIC
========================================= */
let currentCategory = "face";
let activeSelections = {}; 

document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        
        // Scroll button into view smoothly
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        
        renderGrid();
    });
});

function renderGrid() {
    const grid = document.getElementById('itemsGrid');
    const items = db[currentCategory];
    grid.innerHTML = '';

    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item-card';
        if(activeSelections[currentCategory] === item.name) div.classList.add('selected');
        
        let displayColor = item.color || item.value || '#333';
        if(item.name === "None") displayColor = "transparent; border: 2px dashed #666";
        if(item.type === "expr") displayColor = "#ffca28"; 

        div.innerHTML = `
            <div class="color-blob" style="background: ${displayColor}"></div>
            <div class="item-name">${item.name}</div>
        `;
        div.onclick = () => {
            activeSelections[currentCategory] = item.name;
            applyItem(item);
            renderGrid(); // Re-render to show selection border
        };
        grid.appendChild(div);
    });
}

function applyItem(item) {
    if(currentCategory === 'face') {
        if(item.type === 'skin') root.style.setProperty('--skin-color', item.value);
        if(item.type === 'expr') {
            const m = document.getElementById('mouth');
            if(item.value === 'smile') { m.style.width='30px'; m.style.height='15px'; m.style.borderRadius='50%'; m.style.borderBottom='4px solid #522e27'; m.style.borderTop='none'; m.style.background='transparent'; }
            if(item.value === 'neutral') { m.style.width='20px'; m.style.height='4px'; m.style.borderRadius='4px'; m.style.background='#522e27'; m.style.border='none'; }
            if(item.value === 'surprised') { m.style.width='15px'; m.style.height='20px'; m.style.borderRadius='50%'; m.style.background='#522e27'; m.style.border='none'; }
        }
    }
    else if(currentCategory === 'hair') {
        root.style.setProperty('--hair-color', item.color);
        avatarEl.className = `avatar hair-style-${item.style}`;
    }
    else if(currentCategory === 'tops') {
        root.style.setProperty('--top-color', item.color);
        document.getElementById('hoodiePocket').style.display = 'none';
        document.getElementById('hoodieStrings').style.display = 'none';
        
        if(item.style === 'shirt') {
            document.getElementById('shirtButtons').style.display = 'block';
            document.getElementById('chestLogo').style.display = 'none';
            document.getElementById('collar').style.borderRadius = '5px';
        } else {
            document.getElementById('shirtButtons').style.display = 'none';
            document.getElementById('chestLogo').style.display = 'block';
            document.getElementById('collar').style.borderRadius = '50px';
        }
    }
    else if(currentCategory === 'hoodies') {
        root.style.setProperty('--top-color', item.color);
        document.getElementById('shirtButtons').style.display = 'none';
        document.getElementById('chestLogo').style.display = 'block';
        document.getElementById('hoodiePocket').style.display = 'block';
        document.getElementById('hoodieStrings').style.display = 'block';
        document.getElementById('collar').style.borderRadius = '50px';
    }
    else if(currentCategory === 'pants') {
        root.style.setProperty('--pant-color', item.color);
    }
    else if(currentCategory === 'shoes') {
        root.style.setProperty('--shoe-color', item.color);
    }
    else if(currentCategory === 'glasses') {
        const g = document.getElementById('glasses');
        if(item.name === "None") { g.style.display = 'none'; return; }
        g.style.display = 'block';
        root.style.setProperty('--glass-color', item.color);
        if(item.type === 'dark') g.classList.add('sunglasses');
        else g.classList.remove('sunglasses');
    }
    else if(currentCategory === 'hats') {
        const h = document.getElementById('hat');
        if(item.name === "None") { h.style.display = 'none'; return; }
        h.style.display = 'block';
        root.style.setProperty('--hat-color', item.color);
    }
}

function randomizeAvatar() {
    const cats = Object.keys(db);
    cats.forEach(c => {
        const arr = db[c];
        const randomItem = arr[Math.floor(Math.random() * arr.length)];
        currentCategory = c; 
        activeSelections[c] = randomItem.name;
        applyItem(randomItem);
    });
    // Reset category back to face visually
    document.querySelectorAll('.cat-btn')[0].click();
}

function saveAvatar() {
    // Save selections to LocalStorage to use in profile page
    localStorage.setItem('zudio_avatar_config', JSON.stringify(activeSelections));
    
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
}

async function downloadAvatar() {
    if(typeof html2canvas === "undefined") { alert("Please wait for the page to load."); return; }
    
    // Temporarily hide the download button to not include it in screenshot
    document.querySelector('.download-btn').style.display = 'none';
    
    const stage = document.getElementById("previewArea");
    const canvas = await html2canvas(stage, { backgroundColor: "#0f1014", scale: 2 });
    
    document.querySelector('.download-btn').style.display = 'block';

    const link = document.createElement("a");
    link.download = "zudio-avatar.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

// Initial Load
randomizeAvatar();
renderGrid();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
